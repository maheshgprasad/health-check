[project]
name = "health-check"
version = "1.0.0"
description = "Connectivity checks for Redis, MongoDB, MySQL, and RabbitMQ"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "redis>=4.2",
    "pymongo>=4",
    "pika>=1.2",
    "python-decouple>=3.6",
    "mysql-connector-python>=8",
]

[project.scripts]
health-check = "healthcheck.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["healthcheck*"]
